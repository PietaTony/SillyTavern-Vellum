# 第三期 · 出 .exe／.app（散布規格 §4）
#
# 🔴 **不簽章，$0 出貨**。分界線很乾脆：
#   · Windows 未簽章 ⇒ SmartScreen 警告，**擋得住但過得去**
#   · macOS 未簽章 ⇒ `com.apple.quarantine` 只有「從瀏覽器下載」才會加。
#     自己 build 的 `.app` 雙擊就開；**但掛上 GitHub Release 給別人下載的一定帶 quarantine
#     ⇒ 那一刻 Apple Developer US$99/年是必要而非可選。**
# ⇒ 現在產出的 `.app` **只適合自己用**。要給別人下載之前必須先簽章＋公證。
# 🔴 **`--publish never` 寫在 `package.json` 的 `app:build` 裡，不是可選的。**
# electron-builder **偵測到 CI 就會自動嘗試發佈到 GitHub Releases**
# （2026-08-27 實測：`Implicit publishing triggered by CI detection`，
#  只因為沒有 `GH_TOKEN` 才停下來）。
# ⇒ 沒有那個旗標的話，一次「只是想 build 一個 exe 給朋友測」會變成**真的發了一版**。
appId: dev.vellum.app
productName: Vellum
# 🔴 **這段的用途是「產生 feed 檔」，不是「發佈」。**
# 有了它，electron-builder 才會 ① 把 `app-update.yml` 塞進 app 的 resources（`autoUpdater`
# 靠它知道要去哪裡查更新）② 在 `dist-app/` 產出 `latest.yml`／`latest-mac.yml`。
# 上傳仍然是 CD 的事（`cd.yml` 的 `release` job），**不是 electron-builder 的事**——
# 上面那段 `--publish never` 的理由完全沒有變，加了 publish 之後只有更重要。
publish:
  provider: github
  owner: PietaTony
  repo: SillyTavern-Vellum
directories:
  output: dist-app
# 🔴 打包完對整個 bundle 做 ad-hoc 簽章 —— 理由與實測數據在該檔檔頭。
# 少了它，使用者看到的是「檔案已損毀」而不是「未識別的開發者」，而且**沒有放行按鈕**。
afterPack: ./scripts/after-pack.cjs
# 🔴 x64 zip 改名成帶 `intel` 字樣**不是**用這裡的 hook 做——實測 `afterAllArtifactBuild`
# 跑的時候 `latest-mac.yml` 還沒寫出來（理由與實測在 scripts/rename-mac-intel-zip.cjs
# 檔頭）。改名是 `package.json` 的 `app:build` 在整個 electron-builder CLI 跑完之後
# 才串接的獨立步驟。
# 🔴 只放 runtime 真的要的東西。`node_modules` 不進去 —— 相依已經全 bundle 進
#    `dist-server/index.mjs`（同 zip 那條路，理由見 scripts/package-zip.ts）。
files:
  - electron/**
  - dist/**
  - dist-server/**
  - default/**
  - package.json
  # 🔴 **AGPL：散布就要附授權全文。** 桌面版一樣算散布。
  - LICENSE
  # 🔴 打包進來的上百個第三方套件（MIT／BSD／ISC）也各自要求保留版權聲明與全文。
  #    ⚠️ 這一行漏掉不會有任何錯誤訊息 —— 只會安靜地違反上百個授權。
  - THIRD-PARTY-NOTICES.md
mac:
  category: public.app-category.productivity
  # 🔴 **強制不簽章。** 不寫這一行的話 electron-builder 會**自動撈本機鑰匙圈裡的憑證** ——
  #    2026-08-27 實測，它撈到了一張**公司的** `Apple Distribution` 憑證並拿去簽。
  #    這是個人 side project，不可以用公司的身分簽章（見 AGENTS.md 的絕不可做）。
  #    要簽章是另一次刻意的決定（給別人下載才需要，US$99/年）。
  #
  # 🔴 **2026-08-28：Peter 已決定付費申請 Apple Developer Program 做簽章＋公證**——
  #    這一行還沒改，因為憑證還沒申請下來。等憑證到手，要改的**不是**單純刪掉這一行：
  #
  #    1. 用 `security find-identity -v -p codesigning` 印出憑證清單，把那張
  #       `Developer ID Application: <全名> (<TEAMID>)` 的**完整字串**原封不動貼進
  #       `identity:`。⚠️ **不可以只留姓名片段或整個刪掉這一行**——
  #       `app-builder-lib/out/codeSign/macCodeSign.js` 實測過：`identity` 是對
  #       `security find-identity` 每一行做**子字串比對**，而找不到「Developer ID
  #       Application:」型別的憑證時，它的 fallback 邏輯（同檔案 `_findIdentity`）
  #       會掃「任何不是蘋果已知字首的憑證」，而 `Apple Distribution:` 字首**不在**那份
  #       排除清單裡（`appleCertificatePrefixes` 只列了四個 Developer ID／3rd Party
  #       Mac Developer 字首）——這就是上面那次「撈到公司憑證」事故的實際成因。
  #    2. ⚠️ **`CSC_IDENTITY_AUTO_DISCOVERY=false`（`cd.yml` 已經在設）不能當防線。**
  #       2026-08-28 讀原始碼實測：這個版本（`electron-builder@26.15.3`）裡它只影響
  #       找不到憑證時的**警告文字**（`macCodeSign.js` 的 `reportError`），完全沒有出現在
  #       `macPackager.js`／`MacTargetHelper.js` 真正呼叫 `findIdentity` 的路徑上——
  #       換句話說，只設這個環境變數、卻把 `identity:` 留空或刪掉，一樣會落入上面那個
  #       「掃到公司憑證」的洞，這個變數擋不住。**只有明確寫死 `identity:` 字串才擋得住。**
  #    3. `hardenedRuntime`（預設 `true`）與 entitlements 不用另外處理——
  #       electron-builder 內建的 `templates/entitlements.mac.plist` 已經包含
  #       Electron 在 hardened runtime 下需要的三個 entitlement（allow-jit／
  #       allow-unsigned-executable-memory／disable-library-validation），
  #       這個專案沒有 `build/entitlements.mac.plist` 覆蓋它，會自動套用內建版本。
  #    4. 公證怎麼觸發：`mac.notarize`（預設開啟，不用寫）在 `identity` 是真實憑證
  #       **且**下列三組環境變數其中一組存在時自動跑：
  #       ① `APPLE_API_KEY`／`APPLE_API_KEY_ID`／`APPLE_API_ISSUER`（App Store Connect
  #       API key——CI 建議這組，不用存 Apple ID 密碼、不會被要求二階段驗證）
  #       ② `APPLE_ID`／`APPLE_APP_SPECIFIC_PASSWORD`／`APPLE_TEAM_ID`
  #       ③ `APPLE_KEYCHAIN`／`APPLE_KEYCHAIN_PROFILE`（只適合本機，CI 沒有長駐鑰匙圈）
  #       CI 另外還需要 `CSC_LINK`（憑證 .p12 的 base64）＋ `CSC_KEY_PASSWORD`
  #       （匯出密碼）——這組跟上面的公證憑據是**兩件不同的事**：`CSC_LINK` 是「把憑證
  #       裝進 CI 的暫時鑰匙圈」，`APPLE_*` 是「公證服務登入用」。**兩種都要有** CI 才簽得出來。
  #    ⚠️ 這四點是查證，不是已經接上——`GH_TOKEN`／`CSC_LINK`／`APPLE_*` 這些 secrets
  #    要等 Peter 決定要用哪組公證憑據之後才會加進 `cd.yml`，不在這次改動範圍。
  identity: null
  # 🔴 **兩種架構都要出**（Peter 2026-08-27：「windows-exe／intel mac／arm mac 都發」）。
  #    只出 arm64 的話，Intel Mac 使用者下載到一個**永遠打不開**的 dmg ——
  #    而那個症狀會被誤認成 GAP-100 那個「檔案已損毀」，他會以為是檔案壞了。
  # 🔴 **只出 zip，不出 dmg**（Peter 2026-08-27：「我只想要 release 出現三個檔案」）。
  #    判準不是「哪個好用」，是**哪個檔自動更新非用不可**：
  #    `latest-mac.yml` 的 `path:` 指向的是 **zip**（實測 v0.2.12 的 feed 檔），
  #    dmg 只是給人下載的第二份 ⇒ 留 zip 才可能剛好三個，留 dmg 就會變成四個 mac 檔。
  #    ⚠️ 代價：解壓得到的是 `Vellum.app`，使用者要自己拖進「應用程式」——
  #    dmg 會幫他引導那一步。下載說明裡已補上這句。
  target:
    - target: zip
      arch: [arm64, x64]
win:
  # 🔴 **檔名不可以有空白。** GitHub 會把資產名裡的空白換成點（`Vellum.Setup.0.2.12.exe`），
  #    而 electron-builder 寫進 `latest.yml` 的是連字號（`Vellum-Setup-0.2.12.exe`）⇒
  #    **兩邊對不上，自動更新下載當場 404**（2026-08-27 實測那個網址真的是 404）。
  #    ⚠️ 這個 bug 只壞在「下載」那一段，「查得到新版」照常 ⇒ 使用者看到的是
  #    「一直提示有新版，但更新永遠不會完成」。名字裡沒有空白，GitHub 就不會改寫。
  artifactName: ${productName}-Setup-${version}.${ext}
  target:
    - nsis
linux:
  target:
    - AppImage
