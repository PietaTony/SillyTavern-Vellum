# 在真的 Windows／macOS 機器上 build 桌面版，產物掛成 CI artifact。
#
# 觸發：**推 `staging` 就自動跑雙平台**（Peter 2026-08-27 指名），也可以手動指定平台。
#
# 🔴 **這不是發版。** 不建 GitHub Release、不打 tag、不動 main ——
#    產物只留在這次 run 的 Artifacts 裡（預設保留 90 天）。
#    要發版走 release.yml（打 tag 才會跑）。
#
# 🔴 **為什麼不在 Mac 上 build Windows 的 exe**：那要 Wine，產出不可信。
#    Windows 的東西要在 Windows 上 build。
#
# 用法：Actions → desktop → Run workflow（選分支）
name: desktop

on:
  push:
    branches: [staging]
    # 🔴 只改文件不值得燒兩台 runner 六分鐘。
    paths-ignore: ['**.md', 'plans/**', 'NOTES/**', 'docs/**']
  workflow_dispatch:
    inputs:
      platforms:
        description: '要 build 哪些平台'
        type: choice
        default: both
        options: [windows, mac, both]

# 🔴 **同一條分支只留最新一次。** 連推三個 commit 不該排隊 build 三次雙平台 ——
#    前兩次的產物在推完第三次的那一刻就沒有人要了。
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ⚠️ **兩個 job 寫開，不用 matrix** —— job 層的 `if` **讀不到 `matrix`**
  #    （GitHub 的限制，實測 HTTP 422 `Unrecognized named-value: 'matrix'`）。
  #    用 matrix 就沒辦法「只跑被選到的平台」。重複幾行換一個真的能選的開關。
  windows:
    # `push` 觸發時 `inputs` 是空的 ⇒ 兩邊都要跑。**不要只寫 inputs 判斷**，
    # 那會讓自動觸發的 run 兩個 job 都被跳過，而 run 本身還是綠的 —— 假綠燈。
    if: github.event_name == 'push' || inputs.platforms == 'windows' || inputs.platforms == 'both'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0
      - run: pnpm app:build
        env:
          # 🔴 不要讓 electron-builder 去撈 runner 上任何憑證（本機實測它會自己撈）。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # 🔴 順手也附一份 Node zip —— exe 萬一在朋友機器上打不開，
      #    那條路只要裝 Node 就能跑，不用等下一次 CI。
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: vellum-windows
          retention-days: 14
          if-no-files-found: error # 沒產出要紅，不要給一個空的 artifact
          path: |
            dist-app/*.exe
            dist-zip/*.zip

  mac:
    if: github.event_name == 'push' || inputs.platforms == 'mac' || inputs.platforms == 'both'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0
      - run: pnpm app:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: vellum-mac
          retention-days: 14
          if-no-files-found: error
          path: |
            dist-app/*.dmg
            dist-app/*.zip
            dist-zip/*.zip
