name: tmp-selftest-notify
on:
  workflow_dispatch:
    inputs:
      fail:
        type: boolean
        default: false

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ inputs.fail }}" = "true" ]; then
            echo "man-made failure for selftest"; exit 1
          fi
          echo "ok"

  notify:
    needs: [main]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: echo "notify job ran — this must only happen when main failed"
