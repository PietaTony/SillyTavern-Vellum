# 打了 tag 才發佈。🔴 push 到 main 不會發版 —— 發版要是刻意的動作。
#
# 用法：
#   1. 改 package.json 的 version
#   2. git tag v0.1.0 && git push origin v0.1.0
#   3. 這支會 build、打包成一個 zip，並開一個 GitHub Release 掛上去
#
# 🔴 **只有一個 zip，不分平台。** 裡面是純 JS（相依全 bundle 進 dist-server/index.mjs，
#    零 native module），Mac 與 Windows 的啟動檔都在同一包裡。
#    分平台出兩包只會讓使用者多一個選錯的機會。
#
# 🔴 **`packages: write` 已經拿掉** —— 不再推 image 到 ghcr.io（2026-08-27 移除 Docker）。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # 開 Release、掛檔案

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0
      - run: pnpm build
      # 🔴 打包腳本自己會擋「有 symlink」與「有 node_modules」，不是只壓一壓就送出去。
      - run: pnpm package

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist-zip/*.zip

  # 🔴 **第三期 · 桌面 app（額外的那一層）。**
  # zip 那條路不依賴這個 job —— 上面 `zip` 先跑完、Release 先有東西可下載。
  #
  # 🔴 **一律不簽章**（`electron-builder.yml` 的 `identity: null`）：
  #   · Windows 未簽章 ⇒ SmartScreen 警告，擋得住但過得去
  #   · macOS 未簽章 ⇒ 從瀏覽器下載的 `.app` 會帶 quarantine，**別人打不開**
  # ⇒ **`.dmg`／`.zip` 這兩個 mac 產物目前只適合自己用。**
  #    要給別人下載必須先簽章＋公證（Apple Developer US$99/年），那是另一次決定。
  desktop:
    strategy:
      fail-fast: false # 一個平台掛掉不該讓另一個平台的產物也發不出去
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0
      - run: pnpm app:build
        env:
          # 🔴 不要讓 electron-builder 去撈 runner 上任何憑證。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # 🔴 **`--publish never` 已經寫在 `app:build` 裡**（GAP-98）：
          #    electron-builder 偵測到 CI 就會自動發 Release，一次「只是想 build」
          #    會變成真的發版。掛上 Release 的動作由下面那一步明確做。
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-app/*.dmg
            dist-app/*.exe
            dist-app/*.zip
