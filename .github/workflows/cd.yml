# 推 `main` → 閘門綠 → build 三平台 → 自動發 GitHub Release。
# main 前進本身**不再由這支 workflow 做**——Peter 在 GitHub UI 上人工合併
# `staging → main` 的 PR，那一按才是「promote」。這支只在那之後跑，只驗
# 「這個已經被 Peter 核准前進的 SHA 能不能發」，不再驗、也不再做「該不該前進」。
#
# 🔴 **這一支就是「prod」的發版動作**（Peter 2026-08-28 本人裁定：staging 進哪一版由
#    中控線審，`staging → main` 由 Peter 本人審 —— **合併那一按就是發版那一按**，
#    原話「推staging = 自動合main拔除／Staging=> main 給我人工審核／Staging你審／Main我審核」）。
#    ⚠️ **這是對 2026-08-27 裁定②的收回，不是實作者自行放寬或收緊**：2026-08-27
#    原本是「推 staging 全自動 CD，朋友永遠拿得到最新版」；2026-08-28 Peter 本人
#    把它改成「**他按了才拿得到**」——代價是明講過的，見 2026-08-28 那次對話。
#    `desktop.yml` 與 `release.yml` 已被它吸收並刪除 —— **一件事只留一條路。**
#
# 🔴 **`GITHUB_TOKEN` 推出去的 commit 與 tag 不會觸發任何 workflow**（GitHub 的防迴圈機制）。
#    這件事在「推 staging 觸發」的舊設計裡是優點（防 `promote` 推 main 繞回來觸發自己）；
#    搬到「推 main 觸發」之後，**同一個機制變成故障點**：任何 bot／workflow 用
#    `GITHUB_TOKEN` 推 main 都**不會**觸發這支、也就不會發版，推上去卻什麼都沒發生。
#    只有 Peter 在 GitHub UI 上手動合併 PR（以他本人身分產生的 push 事件）才會觸發。
#    ⇒ **這支 workflow 裡不可以再出現任何用 GITHUB_TOKEN 推 main 的步驟**——
#      舊版 `promote` job（fast-forward main）已整個移除，main 的前進只能來自
#      人工合併 PR，沒有第二條路可以繞過 Peter。
#
# 🔴 **版號不寫回 repo。** patch 用 `github.run_number`——它跟著這支 workflow 檔本身
#    單調遞增，不論由哪個分支的哪種事件觸發，都是同一個計數器，換觸發分支**不會**
#    讓它跳號或倒退，只會因為 main 前進得比 staging 少而前進得比較慢。
#    每個 build job 在 build 前把 `package.json` 就地改成該值（不 commit）。
#    這樣 **Release 的 tag == app 內顯示的版本**，只有一把尺。
#    `package.json` 裡留的 `0.2.0` 只提供 major.minor。
name: cd

on:
  push:
    branches: [main]
    # 🔴 只改文件不值得燒三台 runner，也不值得多一個 Release 版本。
    #    ⚠️ 這代表「只改 RELEASE-NOTES/next.md 的 PR 合進 main」不會發版——這是刻意的：
    #    staging 累積到要 promote 時通常帶著程式碼一起合，純文件合併沒有東西可發。
    #    真出現「補寫發版說明」的獨立 PR 而需要發版，改一行程式碼一起帶進去即可。
    paths-ignore: ['**.md', 'plans/**', 'NOTES/**', 'docs/**']
  workflow_dispatch:

# 同一條分支只留最新一次 —— 連推三個 commit，前兩包在推完第三次的那一刻就沒人要了。
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 開 Release、建 tag（main 不再由這支 workflow 推）

jobs:
  # 🔴 **手動觸發要守分支。** `workflow_dispatch` 可以從任何分支跑，而這支會對外發版 ——
  #    這個 repo 有 `upstream-staging`（上游 ST 的鏡像，clone 下來就在），從那條跑一次
  #    就會把 ST 的 code 當成 Vellum 發出去。守在最前面，後面全部 `needs` 它。
  #    觸發點從 staging 搬到 main 之後，這條防護**原樣照搬、只是換了要守的分支**——
  #    不可以因為「main 只有 Peter 能推」就放鬆或拿掉：`workflow_dispatch` 不受
  #    branch protection 約束，還是能從 `upstream-staging` 手動點來跑。
  guard:
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "cd 只能從 main 跑，現在是 ${{ github.ref }}"
            exit 1
          fi
          echo "分支 OK：${{ github.ref }}"

  # 版號只算一次，其他 job 全部拿同一個值 —— 三個平台各自算會有分岔的風險。
  version:
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "本次版號：${BASE}.${{ github.run_number }}"

  # 十四道閘門 ＋ Node zip。`pnpm verify` 的第一步是 `pnpm build`（不是 tsc）——
  # routeTree.gen.ts 被 gitignore，要 vite build 才生得出來。
  gates:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      # 🔴 `--frozen-lockfile`：裝的是本機審過的同一份 lockfile，CI 不自己解析相依。
      - run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0
      # 🔴 install 之後才改版號 —— 反過來的話 lockfile 檢查有機會多一個變數。
      - name: 蓋上本次版號
        shell: bash
        run: node .github/set-version.mjs "${{ needs.version.outputs.version }}"
      - run: pnpm verify
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: node-zip
          retention-days: 14
          if-no-files-found: error # 沒產出要紅，不要交一個空的 artifact
          path: dist-zip/*.zip

  # 🔴 zip 解出來真的跑得起來 —— **這一關綠了才准發版**。
  # 「build 成功」跟「使用者雙擊之後有東西」是兩件事。
  windows-smoke:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0
      - name: 蓋上本次版號
        shell: bash
        run: node .github/set-version.mjs "${{ needs.version.outputs.version }}"
      - run: pnpm build
      - run: pnpm package

      # 解壓到一個乾淨目錄 —— 🔴 **不得沿用 repo 裡的 node_modules**，
      # 那正是這裡要證明「不需要」的東西。
      - name: 解壓 zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist-zip/*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP/vellum" -Force
          Get-ChildItem "$env:RUNNER_TEMP/vellum" -Recurse -Depth 1 | Select-Object FullName

      # 🔴 用**啟動檔本身**啟動，不是自己另外下 node 指令 ——
      #    要驗的就是那支 .bat（cd /d、Node 版本檢查、NODE_ENV、VELLUM_OPEN）。
      #    ⚠️ VELLUM_OPEN 在 CI 要關掉，不然會去開一個開不起來的瀏覽器。
      - name: 啟動並冒煙
        shell: pwsh
        run: |
          $dir = (Get-ChildItem "$env:RUNNER_TEMP/vellum" -Directory | Select-Object -First 1).FullName
          $env:VELLUM_OPEN = '0'
          $p = Start-Process -FilePath "$dir\啟動.bat" -WorkingDirectory $env:USERPROFILE -PassThru
          Start-Sleep -Seconds 12

          # 🔴 比對 **body 內容**，不是狀態碼（AGENTS.md §5：HTTP 200 不等於功能正常）
          $v = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8520/api/version).Content
          if ($v -notmatch '"name":"vellum"') { throw "版本端點的 body 不對：$v" }
          if ($v -match '"version":"0\.0\.0"') { throw "版本讀成 0.0.0 —— zip 裡的 package.json 沒生效" }
          # 🔴 CD 專屬：zip 裡的版本必須就是本次要發的那個號，否則 tag 與 app 是兩把尺
          if ($v -notmatch '"version":"${{ needs.version.outputs.version }}"') {
            throw "zip 內版號不是 ${{ needs.version.outputs.version }}：$v"
          }

          # 🔴 前端真的掛得起來 —— 只打 /api/version 的話，mountStatic 沒掛也照樣 200
          $home_ = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8520/).Content
          if ($home_ -notmatch '<div id="root"') { throw "首頁沒有 <div id=root> —— 前端沒掛上" }

          # 從別的目錄啟動（上面 WorkingDirectory 是家目錄），data 仍要建在解壓處
          if (-not (Test-Path "$dir\data")) { throw "data 沒有建在解壓處 —— cd /d 沒生效" }
          if (Test-Path "$env:USERPROFILE\data") { throw "data 被建到家目錄了" }

          $body = '{"name":"冒煙用角色","description":"CI","firstMessage":"hi"}'
          Invoke-WebRequest -UseBasicParsing -Method Post -ContentType 'application/json' `
            -Body $body http://127.0.0.1:8520/api/characters | Out-Null

          Stop-Process -Id $p.Id -Force
          Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3

          # 重啟之後角色還在 —— 這才是「資料真的留在磁碟上」
          $p2 = Start-Process -FilePath "$dir\啟動.bat" -WorkingDirectory $env:USERPROFILE -PassThru
          Start-Sleep -Seconds 12
          $chars = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8520/api/characters).Content
          if ($chars -notmatch '冒煙用角色') { throw "重啟後角色不見了：$chars" }
          Stop-Process -Id $p2.Id -Force
          Write-Host "windows-smoke PASS —— 版號正確、首頁掛得起來、data 在解壓處、重啟後資料還在"

  # 🔴 **Windows 的 exe 要在 Windows 上 build。** 在 Mac 上交叉 build 要 Wine，產出不可信。
  windows-app:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0
      - name: 蓋上本次版號
        shell: bash
        run: node .github/set-version.mjs "${{ needs.version.outputs.version }}"
      # 🔴 **`--publish never` 已經寫在 `app:build` 裡**（GAP-98）：electron-builder 偵測到
      #    CI 就會自己開 Release。掛檔案的動作一律由下面的 `release` job 明確做。**不要拿掉。**
      - run: pnpm app:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # 不要讓它去撈 runner 上任何憑證
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          retention-days: 14
          if-no-files-found: error
          # 🔴 **`latest.yml` 少一個，自動更新就整條斷掉。**
          #    `electron-updater` 靠它比對版本與 SHA512；Release 上沒有它，
          #    已安裝的 app 去查更新會拿到 404，而且**是安靜的**（我們的 error handler 只寫 log）。
          #    ⚠️ 這裡不可以用 `dist-app/*` —— 會把 `.blockmap`、未壓縮的 `win-unpacked/` 全掃進來。
          path: |
            dist-app/*.exe
            dist-app/latest.yml

  mac-app:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0
      - name: 蓋上本次版號
        shell: bash
        run: node .github/set-version.mjs "${{ needs.version.outputs.version }}"
      # 🔴 **簽章＋公證兩組 secrets，兩件不同的事（見 electron-builder.yml mac.identity 上方註解）：**
      #    `CSC_LINK`／`CSC_KEY_PASSWORD` 是「把 .p12 憑證匯進這台 runner 的暫時鑰匙圈」，
      #    `APPLE_ID`／`APPLE_APP_SPECIFIC_PASSWORD`／`APPLE_TEAM_ID` 是「公證服務登入用」——
      #    這裡用 Apple ID＋app-specific password 那組，不是 App Store Connect API key 那組
      #    （兩組擇一即可，Peter 2026-08-28 已經在 GitHub Secrets 設好前者，不要接錯成後者）。
      # 🔴 **`CSC_IDENTITY_AUTO_DISCOVERY: 'false'` 留著，且與 `CSC_LINK` 匯入互不相干。**
      #    2026-08-28 讀原始碼實測（`app-builder-lib/out/macPackager.js` 建構子）：
      #    `codeSigningInfo`（負責把 `CSC_LINK` 匯進暫時鑰匙圈的 `createKeychain` 那段）
      #    只看 `getCscLink()`／`CSC_LINK` 環境變數，從頭到尾沒有讀過
      #    `CSC_IDENTITY_AUTO_DISCOVERY`——**兩條路完全不相交，這個旗標擋不住也不會擋到
      #    `CSC_LINK` 匯入。**而 `mac.identity` 現在是寫死的真實 qualifier（非空字串），
      #    `macCodeSign.findIdentity()` 對非空 qualifier 直接跳過
      #    `isAutoDiscoveryCodeSignIdentity()` 那個分支（`out/codeSign/macCodeSign.js`
      #    的 `findIdentity()`：只有 `isEmptyOrSpaces(identity)` 為真時才會去查這個旗標）
      #    ——這個旗標現在對簽章路徑本身沒有作用。留著的理由是**第二道防線**：
      #    如果以後 `mac.identity` 不小心被改回空字串／`null`（regression），
      #    `CSC_IDENTITY_AUTO_DISCOVERY=false` 會讓 `findIdentity()` 直接回傳 `null`，
      #    擋掉那個「掃到任何非蘋果已知字首憑證」的危險 fallback（GAP-98 的成因）——
      #    比起拿掉它、只靠 `identity:` 單一道防線更安全，不是假防線，只是不是主防線。
      #    ⚠️ **不要把 `WIN_CSC_LINK` 跟這裡的 `CSC_LINK`搞混，也不要把 `CSC_LINK`／
      #    `CSC_KEY_PASSWORD` 加進 `windows-app` job**：`getCscLink("WIN_CSC_LINK")`
      #    在 `WIN_CSC_LINK` 沒設時會 fallback 到通用的 `CSC_LINK`（`platformPackager.js`
      #    的 `getCscLink()` 實測過），這張是 Apple 的 .p12，格式跟用途都不對，
      #    加進 Windows job 只會讓那邊嘗試匯入一張簽不了 exe 的憑證。
      - run: pnpm app:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          retention-days: 14
          if-no-files-found: error
          # 🔴 **mac 的自動更新走 `.zip`，不走 `.dmg`。** dmg 是給人手動拖的，
          #    `electron-updater` 下載的是 zip（`electron-builder.yml` 的 mac target 早就有 zip，
          #    只是以前沒上傳）。少了 zip ⇒ latest-mac.yml 指到一個 Release 上不存在的檔。
          path: |
            dist-app/*.dmg
            dist-app/*-mac.zip
            dist-app/latest-mac.yml

  # 🔴 **2026-08-28：`promote` job（fast-forward main）整個拿掉。**
  #    main 的前進不再由這支 workflow 做——Peter 在 GitHub UI 人工合併
  #    `staging → main` 的 PR 就是「promote」，這支只在 main 已經前進**之後**
  #    被那次 push 觸發，直接對已經核准的 SHA 跑 build 與發版。
  #    舊版這裡有一段「用 API 更新 ref、讀回驗證、非 ff 就紅」的討論——那是解決
  #    「怎麼安全地自動前進 main」這個問題；新設計下 main 怎麼前進已經不是
  #    這支 workflow 的責任，所以這個問題連同這段程式碼一起消失，不是被繞過。
  release:
    needs: [version, gates, windows-smoke, windows-app, mac-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 🔴 要讀 RELEASE-NOTES/next.md，這個 job 原本沒有 checkout
      # 🔴 **只收桌面版的產物**（Peter 2026-08-27：「我只想要 release 出現三個檔案」）。
      #    `node-zip`（給有 Node 24、想自己跑的人）不再上架 —— 它仍然會被 build，
      #    `windows-smoke` 那一關驗的就是它，只是不掛到 Release 上。
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: assets
          merge-multiple: true
      - run: ls -lh assets/

      # 🔴 **AGENTS.md §3：閘門要守「涵蓋率」不是守「有沒有資料」。**
      #    `fail_on_unmatched_files` 只保證 `assets/*` 有東西，不保證 feed 檔在裡面。
      #    少了 latest.yml 這一版照樣發得出去，而**所有已安裝的 app 從此靜默收不到更新**——
      #    沒有人會回報這種故障，因為它的症狀就是「什麼都沒發生」。
      - name: 斷言自動更新的 feed 檔都在
        shell: bash
        run: |
          MISSING=0
          for f in latest.yml latest-mac.yml; do
            if [ -f "assets/$f" ]; then echo "  ✅ $f"; else echo "::error::assets/$f 不存在 —— 自動更新會整條斷掉"; MISSING=1; fi
          done
          ls assets/*-mac.zip >/dev/null 2>&1 && echo "  ✅ mac 更新用的 zip" || { echo "::error::assets 裡沒有 *-mac.zip —— latest-mac.yml 會指到不存在的檔"; MISSING=1; }
          ls assets/*Setup*.exe >/dev/null 2>&1 && echo "  ✅ Windows 安裝版（可自動更新的那個）" || { echo "::error::assets 裡沒有 Setup exe"; MISSING=1; }

          # 🔴 **feed 檔在，不代表它指到的檔在。**（2026-08-27 實測）
          #    `latest.yml` 寫的是 `Vellum-Setup-0.2.12.exe`，而 GitHub 上的資產叫
          #    `Vellum.Setup.0.2.12.exe`（空白被換成點）⇒ **那個下載網址是 404**。
          #    症狀特別壞：「查得到新版」照常，只有「下載」那一段死掉 ⇒
          #    使用者看到的是「一直提示有新版，但更新永遠不會完成」。
          #    ⇒ 上面那幾條守的是「有沒有資料」，這一條守的才是**涵蓋率**：
          #      把 feed 檔自己寫的檔名逐一拿去對 assets/。
          #    ⚠️ 用 awk 不用 `sed -E 's/\s*//'`：`\s` 是 GNU 擴充，BSD 上行為不同
          #      （GAP-114 踩過一次「本機測得過、CI 上不一樣」）。
          for f in latest.yml latest-mac.yml; do
            [ -f "assets/$f" ] || continue
            for want in $(awk '$1=="url:"{print $2} $1=="-"&&$2=="url:"{print $3}' "assets/$f" | sort -u); do
              if [ -f "assets/$want" ]; then
                echo "  ✅ $f → $want"
              else
                echo "::error::$f 指到 assets/$want，但那個檔不存在 —— 自動更新會下載到 404"
                MISSING=1
              fi
            done
          done
          exit $MISSING

      # 🔴 RN3：發版說明缺席就要紅，不可以靜靜發一個沒有說明的版本。
      #    判準是「有沒有實質內容」，不是「檔案在不在」——空檔案照樣擋。
      - name: 組出 release notes（下載指引 ＋ 這一版的更新內容）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 拿上一個 Release 的 body 來比對用
        run: |
          NOTES=RELEASE-NOTES/next.md
          [ -f "$NOTES" ] || { echo "::error::$NOTES 不存在，發版說明沒寫"; exit 1; }
          if [ "$(tr -d '[:space:]' < "$NOTES" | wc -c)" -lt 10 ]; then
            echo "::error::$NOTES 實質內容不足 10 個字元，發版說明沒寫"; exit 1
          fi
          if grep -q '這一版還在準備中' "$NOTES"; then
            echo "::error::$NOTES 還是樣板內容，發版說明沒寫"; exit 1
          fi

          # 🔴 **擋「忘了改，發出上一版的說明」**（GAP-114，2026-08-27 一小時內發生兩次）。
          #    上面三條擋得住「沒寫」，擋不住「寫了但是上一版的」。
          #    next.md 是一份共用檔，多條線都可能在合進 staging、甚至合進 main 之前
          #    忘記改它——合併的人不會知道要先改它，所以這不是疏失，是**必然**。
          #    ⚠️ 比對的是**正文**（分隔線之後），不是整份 body：
          #    下載表格每一版都一樣，拿整份比會永遠相同。
          PREV=$(gh api "repos/${{ github.repository }}/releases/latest" -q .body 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            # 取上一版的正文：最後一個 `---` 之後。
            # ⚠️ **不要用 `awk 'BEGIN{RS="\n---\n"}'`** —— 多字元 RS 是 GNU 擴充，
            #    BSD awk（macOS）不支援 ⇒ 本機測得過、CI 上行為不同。下面這個是 POSIX 的。
            PREV_BODY=$(printf '%s\n' "$PREV" | awk '/^---\r?$/{buf=""; next} {buf=buf $0 "\n"} END{printf "%s", buf}')
            norm() { tr -d '[:space:]' ; }
            if [ "$(printf '%s' "$PREV_BODY" | norm)" = "$(norm < "$NOTES")" ]; then
              echo "::error::$NOTES 跟上一個 Release 的說明一模一樣 —— 這一版改了什麼還沒寫"
              exit 1
            fi
            echo "  ✅ 發版說明與上一版不同"
          else
            echo "  ⚠️ 查不到上一個 Release（第一版？）—— 跳過重複比對"
          fi
          # 下載表格裡寫的是 `Vellum Setup <版本>.exe`，但使用者眼前的檔名是
          # `Vellum.Setup.0.2.7.exe` —— 讓他自己把佔位符換算成版號是我們偷懶。
          #
          # 🔴 **`sed` 要套在合併後的整份，不能只套下載表格。**
          #    2026-08-27 run #3 就是這樣紅的：`sed` 只跑 `_download-table.md`，
          #    但 `next.md` 裡也有 `<版本>`，而下面那道斷言掃的是**合併後**的 body
          #    ⇒ **斷言的範圍比替換的範圍大，必然失敗**。
          #    後果不只是紅：main 的前進來自 Peter 已經核准合併的 PR，不是這個 job
          #    推的 —— 這一步失敗不會讓 main 倒退，但會留下「main 前進了、卻沒有
          #    對應 Release」的缺口，跟 GAP-113 是同一種不變式斷裂，只是起點換了。
          {
            cat RELEASE-NOTES/_download-table.md
            echo
            echo '---'
            echo
            cat "$NOTES"
          } | sed 's/<版本>/${{ needs.version.outputs.version }}/g' > release-body.md
          grep -q '<版本>' release-body.md && { echo "::error::還有沒被換掉的 <版本> 佔位符"; exit 1; } || true
          echo "--- 實際要發出去的 body ---"; cat release-body.md

      # 🔴 tag 由這一步當場建（`GITHUB_TOKEN` 推的 tag 不會觸發 workflow，
      #    所以「打 tag 再讓別支發版」那條路是死的）。
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          # 🔴 不用 generate_release_notes —— 它列的是我們的 commit／PR 標題，
          #    那是寫給自己看的。使用者看的內容一律來自 RELEASE-NOTES/next.md。
          fail_on_unmatched_files: true # 少一個平台就要紅，不要靜靜發一包不完整的
          body_path: release-body.md
          files: assets/*

  # 🔴 **這支在守什麼：CD 失敗時，Peter 不用自己去翻 log 才知道。**
  #    2026-08-31 事故：v0.2.22 停了三天，`release` job 的「組出 release notes」
  #    那一步紅了兩次（PR #35、#39），另外 6 個 job 全綠——看起來像發版成功了，
  #    其實沒有，而且**沒有任何人知道**，是中控線事後翻 `gh run view --log-failed`
  #    才查出來的。閘門本身是對的（GAP-114 該擋的都擋了），缺的只是「有人看見」。
  #
  #    Peter 2026-08-31 已裁：自動開 GitHub Issue（不用新 secret，`GITHUB_TOKEN`
  #    內建就有；issue 比 Actions 失敗信難忽略——失敗信那條路已被實證會被忽略；
  #    issue 留痕、可回頭查）。
  #
  #    🔴 標題／內文要說得出**哪一個 job、哪一步**，不能只講「CD 失敗了」——
  #    這是本票的驗收線，也是 v0.2.22 那次事故真正缺的東西。job 層級的
  #    `${{ needs.*.result }}` 只知道「哪個 job」，不知道「哪一步」；
  #    要挖到 step 名稱，得回頭打 Actions API 查這次 run 自己的 job 列表
  #    （`GET /actions/runs/{run_id}/jobs`），對每個 `conclusion=="failure"`
  #    的 job 再挑出 `steps[]` 裡同樣 `conclusion=="failure"` 的那一個。
  #
  #    🔴 `if: failure()` 搭配下面這串 `needs`：只要清單裡任何一個 job 失敗
  #    （包含 `guard`本身），這個 job 就會跑；上游失敗導致的下游 `skipped`
  #    不算 `failure()`，但不影響——只要有一個真的 `failure` 就會觸發。
  #    成功的 CD 這個 job 直接被跳過（`skipped`），不會打任何 API、不會開 issue。
  #
  #    🔴 去重：同一個 workflow 檔連續失敗在同一個 job／step 上，不開第二張 issue，
  #    在既有那張底下留言。簽章 = 排序後的「job → step」清單的 sha256，藏在
  #    issue body 裡的 HTML 註解（`<!-- cd-failure-sig: ... -->`）——找得到就是
  #    同一組失敗，留言；找不到（新的失敗模式，或上一張已經被關掉）才開新的。
  #    不用「同標籤的第一張」這種粗略去重：不同 job／step 失敗是不同的事，
  #    各自留痕才查得到，也才關得掉。
  #    🔴 **這個 job 自己失敗，就回到原點**（2026-08-31 驗證時真的發生過一次，
  #    run 33399546267：這個 repo 當時 Issues 功能是關的，`gh issue create` 直接
  #    `the repository has disabled issues`，`notify-on-failure` 自己 `conclusion:
  #    failure`）。**判斷者：Peter 2026-09-01 直接裁定「接受，不補（第二層）」**——
  #    不是中控線代替他表態，是問過他本人拿到的答案。
  #    理由（Peter 本人給的，照實抄，不是事後合理化）：**第二層其實已經存在**——
  #    `notify-on-failure` 自己掛掉時，這個 workflow run 的整體結論仍然是
  #    `failure`，GitHub 照樣會發 Actions 失敗信；承認那條路已經被證實會被忽略
  #    （就是這整張票的起因），但它確實存在，不是零層防護。而 `notify-on-failure`
  #    自己掛掉的觸發條件很窄（Issues 被關、`GITHUB_TOKEN` 被限流、jq 在沒預期到
  #    的 API 回應上熔斷），再疊一層專門監控這個 job 會陷入「誰監控監控者」的
  #    遞迴，沒有終點。
  #
  #    🔴 **去重簽章目前會被分支名污染，範圍很窄，記錄不修**：`guard` 是整支
  #    workflow 裡唯一沒有寫 `name:` 的 step，GitHub 用 `run:` 腳本的第一行自動
  #    命名，而那行腳本內嵌 `${{ github.ref }}`——腳本渲染後分支名就刻進了自動
  #    產生的 step 名稱裡（實測：從 `p1/cd-failure-issue` 誤觸得到的 step 名稱是
  #    `Run if [ "refs/heads/p1/cd-failure-issue" != "refs/heads/main" ]; then`）。
  #    這個名稱會進到下面的「job → step」簽章，所以**不同分支誤觸 `workflow_
  #    dispatch` 導致的 guard 失敗，彼此的去重簽章不同，不會互相合併**。
  #    影響範圍僅止於此：`cd.yml` 其餘 job 的每個 `run:` 步驟都寫了固定字串的
  #    `name:`，不受這個問題影響；而 `cd.yml` 真正的觸發路徑是 `push: [main]`，
  #    那條路上 `github.ref` 恆為 `refs/heads/main`，guard 在正常路徑上不會因為
  #    分支不同而產生不同簽章。不修的理由：`workflow_dispatch` 從非 main 分支
  #    誤觸本來就是操作者自己按下去的，人已經在 Actions 頁面上，不靠 issue 才
  #    看得到；真正需要去重的是無人在場的 push 路徑，那條不受影響。
  #
  #    🔴 **「成功的 CD 不會開 issue」這件事，沒有一次真正全綠的 `cd.yml` run
  #    可以佐證，這裡誠實記下卡在哪，不要重新去踩**：
  #    ① 想過用一支獨立的最小合成 workflow（只有 `if: failure()` 這個機制本身，
  #       不牽動 `cd.yml` 的其他 job）零成本測，但 GitHub 的規則是**任何 workflow
  #       檔的 `workflow_dispatch` 觸發，第一次啟用一定要先出現在 default branch
  #       上**，新檔案只存在於功能分支時 `POST .../actions/workflows/<file>/
  #       dispatches` 一律 404（`workflow <file> not found on the default branch`）
  #       ——2026-08-31／09-01 兩次分別用檔名與 commit sha 當 `ref` 都得到同一個
  #       404，`gh api repos/.../actions/workflows` 清單裡也從未出現過那支檔案，
  #       `gh api "repos/.../actions/runs?branch=..."` 對那個分支也查不到任何一次
  #       它的 run——不是「沒去按」，是這條路在功能分支上技術上按不到。
  #    ② 讓 `cd.yml` 本身真的跑到全綠，會一路跑進 `release` job：那一步用正式
  #       簽章憑證與 `GITHUB_TOKEN` 真的對外開一個 tag／GitHub Release。為了測
  #       「不開 issue」而真的發一個測試版本，代價與風險都不成比例，判斷不做。
  #    ⇒ 這條目前只有間接證據：`if: failure()` 是 GitHub 官方文件記載的既定
  #      語意；本檔三次真實觸發的失敗 run 裡，所有非 `guard` 的下游 job 都停在
  #      `skipped`（不是 `failure`），沒有一個誤觸發 `notify-on-failure` 的邏輯去
  #      開 issue。真正「全綠、notify 被跳過」的第一手證據，要等這支 job 隨著一次
  #      正常的 `staging → main` 發版一起跑過一次全綠的 `cd.yml` 才會出現。
  #    ③ 還有一條沒試過的路，留給下一個人：`cd.yml` 本身已經在 `main` 上，
  #      `workflow_dispatch` 打得通（跟 ①的獨立新檔不同）——理論上可以把最小
  #      合成測試臨時塞進 `cd.yml` 檔案本身（不 `needs` 任何真實 job），在功能
  #      分支上 dispatch，驗完再刪掉，繞開①那個「新檔案打不到」的 404。沒有
  #      實測過，也不是必要的擋門條件（`if: failure()` 在「`needs` 全部成功 ⇒
  #      條件為 false ⇒ job 被跳過」這個方向是官方文件寫死的語意，本來風險就低）
  #      ——這個缺口不擋合併；下一次真的全綠發版時去 Actions 頁面確認沒有多開
  #      一張 issue，已經記成發版後的檢查項（Peter／中控線 2026-09-01）。
  notify-on-failure:
    needs: [guard, version, gates, windows-smoke, windows-app, mac-app, release]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # 讀這次 run 自己的 job／step 列表
      issues: write
    steps:
      - name: 找出哪個 job／哪一步失敗，開（或延續）一張 Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -e
          JOBS_JSON=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs")

          # 每一行是「job → step」；job 本身就是失敗單位（沒有個別 step 紅）時，
          # 說清楚是 job 本身，不要留白讓人以為腳本漏抓。
          FAILED=$(echo "$JOBS_JSON" | jq -r '
            [.jobs[] | select(.conclusion=="failure")] as $fj
            | if ($fj | length) == 0 then empty else
              $fj[] | . as $j
              | ([$j.steps[]? | select(.conclusion=="failure") | .name]) as $steps
              | if ($steps | length) > 0
                then $steps[] | "\($j.name) → \(.)"
                else "\($j.name) → （job 本身失敗，查不到個別 step）"
                end
            end
          ')
          # 🔴 這裡故意不吞掉「查不到」——API 沒給答案時要讓人知道要自己去看 run，
          # 不要開一張說「哪裡失敗」卻空著的 issue（等於白開）。
          if [ -z "$FAILED" ]; then
            FAILED="（無法從 Actions API 判定是哪個 job／step —— 可能是逾時或被取消，見 $RUN_URL）"
          fi
          echo "失敗清單：$FAILED"

          FIRST_LINE=$(echo "$FAILED" | head -1)
          TITLE="CD 失敗：$FIRST_LINE"
          SIG_HASH=$(printf '%s' "$(echo "$FAILED" | sort)" | shasum -a 256 | cut -d' ' -f1)
          MARKER="<!-- cd-failure-sig: $SIG_HASH -->"

          EXISTING=$(gh issue list --repo "$REPO" --label cd-failure --state open \
            --json number,body --jq ".[] | select(.body | contains(\"$MARKER\")) | .number" | head -1)

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body \
              "再次失敗（同一組 job／step）：$RUN_URL（觸發：$EVENT，commit $SHA）"
            echo "沿用既有 issue #$EXISTING —— 同一組 job／step 已有未關閉的 issue，不開新的"
          else
            # 🔴 用暫存檔組 body，不用 heredoc——heredoc 的結束分隔字元一旦被
            # YAML block scalar 的縮排帶了空白就找不到，會整段被吃進字串裡。
            BODY_FILE=$(mktemp)
            {
              echo '## CD 失敗'
              echo
              echo '**失敗的 job／step：**'
              echo '```'
              echo "$FAILED"
              echo '```'
              echo
              echo "- 觸發事件：$EVENT"
              echo "- commit：$SHA"
              echo "- run：$RUN_URL"
              echo
              echo '這張 issue 由 `cd.yml` 的 `notify-on-failure` job 自動開出。修好之後手動關閉；'
              echo '同一個 job／step 再次失敗時會在這張底下留言，不會再開一張新的。'
              echo
              echo "$MARKER"
            } > "$BODY_FILE"
            gh issue create --repo "$REPO" --title "$TITLE" --label cd-failure --body-file "$BODY_FILE"
            echo "已開新 issue（首次出現這組 job／step 失敗）"
          fi
